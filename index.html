<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMG ESPORTS Registration</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: #fff;
      min-height: 100vh;
      padding: 24px 14px;
    }
    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }
    .card {
      background: #151522;
      border: 1px solid #2c2c3d;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
    }
    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #b9b9c7;
      margin: 0 0 22px;
    }
    .notice {
      background: #21183a;
      border: 1px solid #5435a0;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid #39394b;
      background: #0f0f18;
      color: white;
      outline: none;
      font-size: 16px;
    }
    input:focus { border-color: #8b5cf6; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: #7c3aed;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      line-height: 1.4;
    }
    .success { display: block !important; background: #12351f; color: #9df0b5; }
    .error { display: block !important; background: #3a1717; color: #ffb0b0; }
    .footer {
      text-align: center;
      color: #888899;
      font-size: 13px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>SMG ESPORTS</h1>
      <p class="subtitle">FF Squad Registration</p>

      <div class="notice">
        <strong>Entry:</strong> ₹120 / squad<br>
        <strong>Maximum teams:</strong> 60
      </div>

      <form id="registrationForm">
        <label for="team">Team Name</label>
        <input id="team" name="team" type="text" required>

        <label for="captain">Captain Name</label>
        <input id="captain" name="captain" type="text" required>

        <label for="uid1">Captain UID</label>
        <input id="uid1" name="uid1" type="text" required>

        <label for="phone">WhatsApp Number</label>
        <input id="phone" name="phone" type="tel" required>

        <label for="uid2">Player 2 UID</label>
        <input id="uid2" name="uid2" type="text" required>

        <label for="uid3">Player 3 UID</label>
        <input id="uid3" name="uid3" type="text" required>

        <label for="uid4">Player 4 UID</label>
        <input id="uid4" name="uid4" type="text" required>

        <button id="submitBtn" type="submit">Submit Registration</button>
        <div id="message"></div>
      </form>
    </div>

    <div class="footer">SMG ESPORTS • Registration</div>
  </div>

  <script>
    const form = document.getElementById('registrationForm');
    const button = document.getElementById('submitBtn');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = 'Submitting...';
      message.className = '';
      message.style.display = 'none';

      const data = Object.fromEntries(new FormData(form).entries());

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.message || 'Registration failed.');
        }

        message.textContent = result.message || 'Registration submitted successfully.';
        message.className = 'success';
        form.reset();
      } catch (error) {
        message.textContent = error.message || 'Something went wrong. Please try again.';
        message.className = 'error';
      } finally {
        button.disabled = false;
        button.textContent = 'Submit Registration';
      }
    });
  </script>
</body>
</html>
